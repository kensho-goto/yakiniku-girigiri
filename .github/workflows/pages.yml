# main に push すると、スマホ用のページ（GitHub Pages）を自動で更新する
name: スマホ用ページを更新
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: npm test
      - name: ゲームのファイルだけを集める
        run: |
          mkdir _site
          cp -r index.html robots.txt manifest.json icon-180.png icon-192.png icon-512.png src play _site/
          V=${GITHUB_SHA::7}
          sed -i "s/?v=dev/?v=$V/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
