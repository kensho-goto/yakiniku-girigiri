# main に push すると、スマホ用のページ（GitHub Pages）を自動で更新する
name: スマホ用ページを更新
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: npm test
      - name: ゲームのファイルだけを集める
        run: |
          mkdir _site
          cp -r index.html about.html sw.js ogp.png robots.txt manifest.json icon-180.png icon-192.png icon-512.png src play fonts _site/
          V=${GITHUB_SHA::7}
          sed -i "s/?v=dev/?v=$V/g" _site/index.html
          sed -i "s/?v=dev/?v=$V/g; s/'ju-v1'/'ju-$V'/" _site/sw.js
          # 載せ忘れを見つける：ページが読むファイルがすべてあるか
          for f in $(grep -oE '(src|fonts)/[A-Za-z0-9_-]+[.](js|woff2)' _site/index.html _site/sw.js | cut -d: -f2 | sort -u) ogp.png about.html sw.js; do test -f "_site/$f" || { echo "ない: $f"; exit 1; }; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
