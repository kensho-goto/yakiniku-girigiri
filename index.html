<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ジュー">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>ジュー（焼肉）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Potta+One&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
  :root { --num: 'Potta One', 'Hiragino Sans', sans-serif; --hand: 'Yusei Magic', 'Hiragino Sans', sans-serif; --fire: #ff7a2f; --gold: #ffd84d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  #safe { position: fixed; top: 0; height: env(safe-area-inset-top); width: 0; visibility: hidden; }
  html, body { margin: 0; height: 100%; background: #1a100c; color: #fff; overflow: hidden; overscroll-behavior: none;
    font-family: 'Yusei Magic', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; font-synthesis: none; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; touch-action: none; display: block; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .overlay[hidden] { display: none; }
  .dim { background: rgba(10, 5, 3, 0.72); }
  .card { width: min(360px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: #2d1b12; border: 3px solid #5a3420; border-radius: 22px; padding: 22px 18px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  h1 { font-family: var(--num); font-weight: 400; margin: 0; line-height: 1.05; }
  .logo { font-size: 46px; color: var(--gold); text-shadow: 0 4px 0 #a3261b, 0 0 24px rgba(255,120,40,.6); transform: rotate(-3deg); }
  .logo small { display: block; font-family: var(--hand); font-size: 18px; letter-spacing: .1em; color: #fff; text-shadow: none; margin-bottom: 6px; }
  /* タイトル：ゲームの絵と同じ物差し（横400×縦760）で置く。どの画面でも、ロゴは客の場所のまん中、カードはトレーの場所 */
  #title { display: block; padding: 0; }
  #titleFrame { position: absolute; left: 0; top: 0; width: 400px; height: 760px; transform-origin: 0 0; }
  #title .tband { position: absolute; left: 0; right: 0; top: 0; height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 8px; }
  #title .logo { font-size: 74px; line-height: 1.05; text-align: center; }
  #title .logo small { font-size: 18px; letter-spacing: .3em; margin-bottom: 2px; }
  /* タイトルは箱を使わない：店の絵の上に、ふちの太い手書きの文字をじかに置く */
  #title { --ink: #2a1206; }
  #title .logo { text-shadow: -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink), 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 0 9px 0 #a3261b, 0 0 30px rgba(255,120,40,.7); }
  #title .logo small { color: #fff; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink); transform: rotate(2deg); }
  #title .card { position: absolute; left: 0; right: 0; bottom: 2px; width: auto; max-height: none; padding: 0 12px 6px; background: none; border: 0; box-shadow: none; border-radius: 0; overflow: visible; }
  #title .stage-next { margin: 0; font-size: 15px; color: #fff; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink); }
  #title .stage-next b { font-size: 17px; }
  #title .btn { width: auto; margin: 0 auto; padding: 0 24px; background: none; border: 0; box-shadow: none; border-radius: 0; font-size: 58px; line-height: 1.05; color: #ffd84d; transform: rotate(-4deg);
    text-shadow: -4px -4px 0 var(--ink), 4px -4px 0 var(--ink), -4px 4px 0 var(--ink), 4px 4px 0 var(--ink), 0 -5px 0 var(--ink), 0 5px 0 var(--ink), -5px 0 0 var(--ink), 5px 0 0 var(--ink), 0 10px 0 #a3261b;
    animation: yaku 1.4s ease-in-out infinite; }
  #title .btn:active { transform: rotate(-4deg) translateY(4px) scale(.96); box-shadow: none; }
  @keyframes yaku { 0%, 100% { scale: 1; } 50% { scale: 1.06; } }
  #title .best { margin-top: 8px; font-size: 14px; color: #fff; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink); }
  #title .best b { font-size: 18px; }
  #title .best:empty { display: none; }
  #title .tiny { display: inline-block; margin: 0 8px; padding: 2px 2px; font-size: 16px; white-space: nowrap; color: #ffe2bf; text-decoration: none;
    text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink); }
  #title .badge { margin-left: 2px; padding: 0; background: none; border-radius: 0; font-family: var(--num); font-size: 18px; color: #ff6a4a; vertical-align: 2px; }
  #title .tiny:nth-of-type(odd) { transform: rotate(-2deg); } #title .tiny:nth-of-type(even) { transform: rotate(2deg); }
  #title .pt-name { margin-top: 6px; padding: 8px 10px; }
  .flow { flex-wrap: nowrap; }
  .tiny { display: block; margin: 10px auto 0; background: none; border: 0; color: #d9b896; font-size: 13px; text-decoration: underline; cursor: pointer; }
  #rotate { z-index: 20; background: #2a1a14; flex-direction: column; text-align: center; font-size: 20px; font-weight: bold; color: #ffd9b0; }
  #rotate .ph { width: 54px; height: 90px; border: 5px solid #ffd84d; border-radius: 12px; margin-bottom: 18px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(90deg); } 60%, 100% { transform: rotate(0deg); } }
  .cost { font-size: 12px; color: #ff9a8a; min-height: 0; }
  .sub { margin: 14px 0 4px; font-size: 15px; color: #ffd9b0; }
  .flow { display: flex; justify-content: center; gap: 4px; margin: 14px 0 6px; font-size: 13px; color: #fff; flex-wrap: wrap; }
  .flow span { background: #4a2a18; border-radius: 10px; padding: 5px 8px; }
  .flow i { font-style: normal; color: var(--fire); align-self: center; }
  .btn { display: block; width: 100%; margin-top: 14px; padding: 15px; font-family: var(--num); font-size: 28px; color: #3a1a00; background: linear-gradient(#ffd84d, #ff9b2f); border: 0; border-radius: 16px; box-shadow: 0 5px 0 #a3561b; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a3561b; }
  .btn2 { display: inline-block; margin: 12px 6px 0; padding: 10px 16px; font-size: 15px; font-weight: bold; color: #ffd9b0; background: #4a2a18; border: 0; border-radius: 12px; cursor: pointer; }
  .best { margin-top: 10px; font-size: 14px; color: #ffd9b0; }
  .best b { font-family: var(--num); font-weight: 400; font-size: 20px; color: var(--gold); }
  .score { font-family: var(--num); font-size: 64px; color: var(--gold); line-height: 1; margin: 6px 0 0; text-shadow: 0 4px 0 #a3261b; }
  .new { display: inline-block; background: #e0302a; color: #fff; font-size: 13px; font-weight: bold; padding: 3px 10px; border-radius: 10px; margin-top: 4px; animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .title { margin-top: 12px; font-size: 13px; color: #ffd9b0; }
  .title b { display: block; font-family: var(--num); font-weight: 400; font-size: 26px; color: #fff; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 4px; }
  .stats div { background: #3d2417; border-radius: 10px; padding: 6px 2px; font-size: 11px; color: #ffd9b0; }
  .stats div b { display: block; font-family: var(--num); font-weight: 400; font-size: 20px; color: #fff; }
  .lessons { text-align: left; margin-top: 10px; font-size: 13px; }
  .lessons div { background: #3d2417; border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
  .lessons b { color: var(--fire); }
  .lessons small { display: block; color: #d9b896; margin-top: 2px; }
  .field { width: 100%; margin-top: 12px; padding: 12px; font-size: 20px; border-radius: 12px; border: 0; text-align: center; }
  .tip { color: #ffb3a0; min-height: 1.2em; font-size: 13px; }
  #gate { z-index: 10; background: #2a1a14; }
  /* ランクの判子 */
  .rank { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 130px; padding: 6px 16px 8px; border-radius: 16px; border: 4px solid; margin-bottom: 4px; transform: rotate(-6deg); }
  .rank .rk { font-family: var(--num); font-size: 52px; line-height: 1; }
  .rank .rw { font-size: 13px; font-weight: bold; margin-top: 4px; }
  .rank.go { animation: stamp .45s cubic-bezier(.2,1.6,.4,1) .3s both; }
  @keyframes stamp { 0% { transform: scale(3) rotate(-6deg); opacity: 0; } 100% { transform: scale(1) rotate(-6deg); opacity: 1; } }
  .r-C { color: #ccc; border-color: #888; background: #3a3a3a; }
  .r-B { color: #ffd2a8; border-color: #b0703a; background: #4a2c16; }
  .r-A3 { color: #2a2a2a; border-color: #fff; background: linear-gradient(#f2f4f7, #b9c0ca); }
  .r-A4 { color: #3a1a00; border-color: #fff3b0; background: linear-gradient(#fff3a0, #ffb32f); }
  .r-A5 { color: #fff; border-color: #ffd84d; background: linear-gradient(135deg, #ff5a8a, #ff9b2f, #ffd84d); text-shadow: 0 3px 0 #a3261b; box-shadow: 0 0 30px rgba(255,180,60,.7); }
  .r-tokusen { color: #fff; border-color: #fff; background: linear-gradient(135deg, #ff5a8a, #ffd84d, #6ee7ff, #b18cff); text-shadow: 0 3px 0 #5a1a6b; box-shadow: 0 0 40px rgba(255,255,255,.8); }
  .r-tokusen .rk { font-size: 48px; }
  .r-kikaku { color: #fff; border-color: #e0302a; background: #111; }
  .r-kikaku .rk { font-size: 46px; color: #e0302a; }
  .next { font-size: 14px; color: #ffd9b0; margin: 2px 0 6px; }
  /* 試遊会 */
  .pt-name { font-size: 16px; padding: 10px; margin-top: 14px; }
  .pt-name.need { outline: 3px solid #ff5a3a; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .pt { margin-top: 14px; background: #3d2417; border-radius: 14px; padding: 10px; }
  .pt-q { font-size: 13px; color: #ffd9b0; margin-bottom: 6px; }
  .pt-faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .pt-faces button { border: 2px solid transparent; background: #2d1b12; color: #ffd9b0; border-radius: 10px; padding: 4px 0 6px; font-size: 11px; cursor: pointer; }
  .pt-faces button span { display: block; font-size: 26px; }
  .pt-faces button.sel { border-color: #ffd84d; background: #5a3420; color: #fff; }
  .pt textarea { width: 100%; margin-top: 8px; border-radius: 10px; border: 0; padding: 8px; font-size: 16px; font-family: inherit; resize: none; }
  .pt-send { margin-top: 8px; }
  .pt-send:disabled { opacity: .4; }
  .pt-thanks { font-size: 15px; font-weight: bold; color: #ffd84d; padding: 6px; }
  .next b { font-family: var(--num); font-weight: 400; color: #ffd84d; font-size: 18px; }
  /* ステージ */
  .stage-next { margin: 12px 0 2px; font-size: 14px; color: #ffd9b0; line-height: 1.5; }
  .stage-next b { color: #fff; font-size: 16px; }
  .stars { color: #ffd84d; letter-spacing: 2px; }
  .stars i { font-style: normal; color: rgba(255,255,255,.22); }
  .slist { text-align: left; margin-top: 10px; }
  .srow { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 6px; padding: 9px 10px; background: #3d2417; border: 0; border-radius: 12px; color: #fff; font: inherit; text-align: left; cursor: pointer; }
  .srow .no { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #ff9b2f; color: #3a1a00; font-family: var(--num); font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .srow .tx { flex: 1; min-width: 0; }
  .srow .no.lvi { background: #5a3420; font-size: 18px; }
  .lvbox { margin: 10px 0 0; padding: 8px 10px; background: #3d2417; border-radius: 12px; font-size: 13px; color: #ffd9b0; }
  .lvbox:empty { display: none; }
  .lvbox .lvrule { display: block; margin-top: 6px; font-size: 11px; line-height: 1.5; color: #e8c9a8; }
  .lvbox .lvl { font-family: var(--num); font-size: 18px; color: var(--gold); }
  .lvbox .bar { height: 6px; margin: 6px 0 2px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  .lvbox .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd84d, #ff9b2f); border-radius: 3px; }
  .lvbox .up { display: block; margin-top: 6px; font-weight: 800; color: #fff; }
  .lvbox .btn2 { margin: 8px 0 0; background: #ff9b2f; color: #3a1a00; }
  .tool .no.lvi { background: #5a3420; font-size: 18px; }
  .tool .pips { flex: none; font-size: 12px; color: var(--gold); letter-spacing: 2px; text-align: center; }
  .tool .pips i { font-style: normal; color: rgba(255,255,255,.2); }
  .tool .pips small { display: block; letter-spacing: 0; color: #3a1a00; background: #ffd84d; border-radius: 8px; padding: 2px 6px; margin-top: 3px; font-weight: 800; }
  .tool.max .pips small { background: #5a3420; color: #ffd9b0; }
  .tool.cant { cursor: default; }
  .tool .tx small .nx { color: #fff; font-weight: 700; }
  .badge { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 8px; background: #e0302a; color: #fff; font-size: 11px; text-decoration: none; }
  .lvhead { margin: 12px 2px 0; font-weight: 800; color: #ffd84d; font-size: 15px; text-align: left; }
  .lvhead small { margin-left: 8px; font-weight: 600; color: #ffd9b0; font-size: 11px; }
  .goalbig { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .goalbig b { color: #ffd84d; font-size: 22px; }
  .srow .tx b { display: block; font-size: 15px; }
  .srow .tx small { display: block; font-size: 11.5px; color: #d9b896; }
  .srow .st { flex: none; font-size: 15px; text-align: center; }
  .srow .goaln { display: block; font-size: 11px; color: #ffd9b0; }
  .srow.lock { opacity: .45; cursor: default; }
  .srow.lock .no { background: #6b4a35; color: #d9b896; }
  .srow.cur { outline: 3px solid #ffd84d; }
  .srow.free .no { background: #e0302a; color: #fff; font-size: 12px; }
  .intro-no { font-size: 14px; color: #ffd9b0; letter-spacing: .1em; }
  .intro-list { text-align: left; margin: 14px 0 6px; padding: 0; list-style: none; }
  .intro-list li { background: #3d2417; border-radius: 10px; padding: 9px 12px; margin-top: 6px; font-size: 15px; line-height: 1.45; }
  .intro-list li::before { content: '🔥 '; }
  .goal { font-size: 13px; color: #ffd9b0; margin-top: 8px; }
  .goal b { font-family: var(--num); font-weight: 400; color: #ffd84d; }
  .rank.r-stage { min-width: 170px; color: #3a1a00; border-color: #fff3b0; background: linear-gradient(#fff3a0, #ffb32f); }
  .rank.r-stage .rk { font-size: 40px; letter-spacing: 4px; }
  .rank.r-stage .rk i { font-style: normal; color: rgba(90,50,10,.3); }
  .rank.r-stage0 { color: #ccc; border-color: #888; background: #3a3a3a; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe"></div>

<div class="overlay" id="title">
 <div id="titleFrame">
  <div class="tband">
    <h1 class="logo"><small>焼肉</small>ジュー</h1>
    <div class="best" id="titleBest"></div>
  </div>
  <div class="card">
    <div class="stage-next" id="titleStage"></div>
    <div id="ptNameBox" hidden><input id="ptName" class="field pt-name" type="text" maxlength="20" autocomplete="off" placeholder="あなたの名前（ニックネームでOK）"></div>
    <button class="btn" id="startBtn">焼く</button>
    <button class="tiny" id="stageBtn">ステージ・本番をえらぶ</button><button class="tiny" id="toolBtn">道具</button>
    <button class="tiny" id="ptNextTitle" hidden title="名前と記録を消して、はじめから">次の人に渡す</button>
  </div>
 </div>
</div>

<div class="overlay dim" id="stages" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:32px">ステージ</h1>
    <div class="slist" id="stageList"></div>
    <button class="tiny" id="lvBtn">腕前をえらびなおす（初心者・中級者・上級者）</button>
    <button class="btn2" id="stagesClose">もどる</button>
  </div>
</div>

<div class="overlay dim" id="tools" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:32px">道具</h1>
    <div class="lvbox" id="toolInfo"></div>
    <div class="slist" id="toolList"></div>
    <button class="btn2" id="toolsClose">もどる</button>
  </div>
</div>

<div class="overlay dim" id="levels" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:32px">腕前は？</h1>
    <p class="sub">いつでも「ステージをえらぶ」から変えられます</p>
    <div class="slist" id="levelList"></div>
    <button class="btn2" id="levelsClose">もどる</button>
  </div>
</div>

<div class="overlay dim" id="intro" hidden>
  <div class="card">
    <div class="intro-no" id="introNo"></div>
    <h1 class="logo" style="font-size:36px" id="introName"></h1>
    <ul class="intro-list" id="introList"></ul>
    <div class="goal" id="introGoal"></div>
    <button class="btn" id="introGo">はじめる</button>
  </div>
</div>

<div class="overlay dim" id="pause" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:38px">ひと休み</h1>
    <p class="sub">火も時間も止まっています</p>
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn2" id="retryBtn">はじめから</button>
    <button class="btn2" id="toTitleBtn">タイトルへ</button>
  </div>
</div>

<div class="overlay dim" id="result" hidden>
  <div class="card">
    <div class="rank" id="rRank"></div>
    <div class="next" id="rNext"></div>
    <div class="score" id="rScore" style="font-size:44px">0</div>
    <div class="cost" id="rCost"></div>
    <div id="rNew"></div>
    <div class="best" id="rBest" style="margin-top:2px"></div>
    <div class="lvbox" id="rLevel"></div>
    <div class="lessons" id="rLessons"></div>
    <button class="btn" id="againBtn">もう一回</button>
    <button class="btn2" id="rRetry" hidden>もう一回</button>
    <button class="btn2" id="rStages" hidden>ステージをえらぶ</button>
    <div class="pt" id="ptFeedback" hidden></div>
    <div class="title">今日の称号<b id="rTitle"></b><span id="rWhy"></span></div>
    <div class="stats" id="rStats"></div>
    <button class="btn2" id="rTitleBtn">タイトルへ</button>
    <button class="btn2" id="ptNextResult" hidden>次の人に渡す</button>
  </div>
</div>

<div class="overlay" id="rotate" hidden>
  <div class="ph"></div>
  スマホを縦にしてね
</div>

<div class="overlay" id="gate" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:36px">ジュー</h1>
    <p class="sub">合言葉を入れてね</p>
    <input id="gateInput" class="field" type="text" autocomplete="off" autocapitalize="off" placeholder="合言葉">
    <p class="tip" id="gateMsg">&nbsp;</p>
    <button class="btn" id="gateBtn">はいる</button>
  </div>
</div>

<script src="src/sim.js?v=dev"></script>
<script src="src/lines.js?v=dev"></script>
<script src="src/draw.js?v=dev"></script>
<script src="src/sound.js?v=dev"></script>
<script src="src/gate.js?v=dev"></script>
<script src="src/playtest.js?v=dev"></script>
<script src="src/main.js?v=dev"></script>
</body>
</html>
