<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>焼肉ギリギリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root { --num: 'Dela Gothic One', 'Hiragino Sans', sans-serif; --fire: #ff7a2f; --gold: #ffd84d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1a100c; color: #fff; overflow: hidden; overscroll-behavior: none;
    font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; touch-action: none; display: block; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .overlay[hidden] { display: none; }
  .dim { background: rgba(10, 5, 3, 0.72); }
  .card { width: min(360px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: #2d1b12; border: 3px solid #5a3420; border-radius: 22px; padding: 22px 18px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  h1 { font-family: var(--num); font-weight: 400; margin: 0; line-height: 1.05; }
  .logo { font-size: 46px; color: var(--gold); text-shadow: 0 4px 0 #a3261b, 0 0 24px rgba(255,120,40,.6); transform: rotate(-3deg); }
  .logo small { display: block; font-size: 22px; color: #fff; text-shadow: 0 3px 0 #a3261b; margin-bottom: 4px; }
  .sub { margin: 14px 0 4px; font-size: 15px; color: #ffd9b0; }
  .flow { display: flex; justify-content: center; gap: 4px; margin: 14px 0 6px; font-size: 13px; color: #fff; flex-wrap: wrap; }
  .flow span { background: #4a2a18; border-radius: 10px; padding: 5px 8px; }
  .flow i { font-style: normal; color: var(--fire); align-self: center; }
  .btn { display: block; width: 100%; margin-top: 14px; padding: 15px; font-family: var(--num); font-size: 28px; color: #3a1a00; background: linear-gradient(#ffd84d, #ff9b2f); border: 0; border-radius: 16px; box-shadow: 0 5px 0 #a3561b; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a3561b; }
  .btn2 { display: inline-block; margin: 12px 6px 0; padding: 10px 16px; font-size: 15px; font-weight: bold; color: #ffd9b0; background: #4a2a18; border: 0; border-radius: 12px; cursor: pointer; }
  .best { margin-top: 10px; font-size: 14px; color: #ffd9b0; }
  .best b { font-family: var(--num); font-weight: 400; font-size: 20px; color: var(--gold); }
  .score { font-family: var(--num); font-size: 64px; color: var(--gold); line-height: 1; margin: 6px 0 0; text-shadow: 0 4px 0 #a3261b; }
  .new { display: inline-block; background: #e0302a; color: #fff; font-size: 13px; font-weight: bold; padding: 3px 10px; border-radius: 10px; margin-top: 4px; animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .title { margin-top: 12px; font-size: 13px; color: #ffd9b0; }
  .title b { display: block; font-family: var(--num); font-weight: 400; font-size: 26px; color: #fff; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 4px; }
  .stats div { background: #3d2417; border-radius: 10px; padding: 6px 2px; font-size: 11px; color: #ffd9b0; }
  .stats div b { display: block; font-family: var(--num); font-weight: 400; font-size: 20px; color: #fff; }
  .lessons { text-align: left; margin-top: 10px; font-size: 13px; }
  .lessons div { background: #3d2417; border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
  .lessons b { color: var(--fire); }
  .lessons small { display: block; color: #d9b896; margin-top: 2px; }
  .field { width: 100%; margin-top: 12px; padding: 12px; font-size: 20px; border-radius: 12px; border: 0; text-align: center; }
  .tip { color: #ffb3a0; min-height: 1.2em; font-size: 13px; }
  #gate { z-index: 10; background: #2a1a14; }
  /* ランクの判子 */
  .rank { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 150px; padding: 8px 18px 10px; border-radius: 18px; border: 4px solid; margin-bottom: 8px; transform: rotate(-6deg); }
  .rank .rk { font-family: var(--num); font-size: 64px; line-height: 1; }
  .rank .rw { font-size: 13px; font-weight: bold; margin-top: 4px; }
  .rank.go { animation: stamp .45s cubic-bezier(.2,1.6,.4,1) .3s both; }
  @keyframes stamp { 0% { transform: scale(3) rotate(-6deg); opacity: 0; } 100% { transform: scale(1) rotate(-6deg); opacity: 1; } }
  .r-C { color: #ccc; border-color: #888; background: #3a3a3a; }
  .r-B { color: #ffd2a8; border-color: #b0703a; background: #4a2c16; }
  .r-A3 { color: #2a2a2a; border-color: #fff; background: linear-gradient(#f2f4f7, #b9c0ca); }
  .r-A4 { color: #3a1a00; border-color: #fff3b0; background: linear-gradient(#fff3a0, #ffb32f); }
  .r-A5 { color: #fff; border-color: #ffd84d; background: linear-gradient(135deg, #ff5a8a, #ff9b2f, #ffd84d); text-shadow: 0 3px 0 #a3261b; box-shadow: 0 0 30px rgba(255,180,60,.7); }
  .r-tokusen { color: #fff; border-color: #fff; background: linear-gradient(135deg, #ff5a8a, #ffd84d, #6ee7ff, #b18cff); text-shadow: 0 3px 0 #5a1a6b; box-shadow: 0 0 40px rgba(255,255,255,.8); }
  .r-tokusen .rk { font-size: 48px; }
  .r-kikaku { color: #fff; border-color: #e0302a; background: #111; }
  .r-kikaku .rk { font-size: 46px; color: #e0302a; }
  .next { font-size: 14px; color: #ffd9b0; margin: 2px 0 6px; }
  /* 試遊会 */
  .pt-name { font-size: 16px; padding: 10px; margin-top: 14px; }
  .pt { margin-top: 14px; background: #3d2417; border-radius: 14px; padding: 10px; }
  .pt-q { font-size: 13px; color: #ffd9b0; margin-bottom: 6px; }
  .pt-faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .pt-faces button { border: 2px solid transparent; background: #2d1b12; color: #ffd9b0; border-radius: 10px; padding: 4px 0 6px; font-size: 11px; cursor: pointer; }
  .pt-faces button span { display: block; font-size: 26px; }
  .pt-faces button.sel { border-color: #ffd84d; background: #5a3420; color: #fff; }
  .pt textarea { width: 100%; margin-top: 8px; border-radius: 10px; border: 0; padding: 8px; font-size: 16px; font-family: inherit; resize: none; }
  .pt-send { margin-top: 8px; }
  .pt-send:disabled { opacity: .4; }
  .pt-thanks { font-size: 15px; font-weight: bold; color: #ffd84d; padding: 6px; }
  .next b { font-family: var(--num); font-weight: 400; color: #ffd84d; font-size: 18px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="overlay dim" id="title">
  <div class="card">
    <h1 class="logo"><small>焼き加減は</small>焼肉ギリギリ</h1>
    <p class="sub">焼いて、返して、余熱を読む。</p>
    <div class="flow"><span>網へ置く</span><i>→</i><span>タップで裏返す</span><i>→</i><span>皿へ</span><i>→</i><span>客へ</span></div>
    <div id="ptNameBox" hidden><input id="ptName" class="field pt-name" type="text" maxlength="20" autocomplete="off" placeholder="あなたの名前（ニックネームでOK）"></div>
    <button class="btn" id="startBtn">焼く</button>
    <div class="best" id="titleBest"></div>
  </div>
</div>

<div class="overlay dim" id="pause" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:38px">ひと休み</h1>
    <p class="sub">火も時間も止まっています</p>
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn2" id="retryBtn">はじめから</button>
    <button class="btn2" id="toTitleBtn">タイトルへ</button>
  </div>
</div>

<div class="overlay dim" id="result" hidden>
  <div class="card">
    <div class="rank" id="rRank"></div>
    <div class="next" id="rNext"></div>
    <div style="font-size:13px;color:#ffd9b0">今回の売上</div>
    <div class="score" id="rScore" style="font-size:48px">0</div>
    <div id="rNew"></div>
    <div class="best" id="rBest"></div>
    <button class="btn" id="againBtn">もう一回</button>
    <div class="pt" id="ptFeedback" hidden></div>
    <div class="title">今日の称号<b id="rTitle"></b><span id="rWhy"></span></div>
    <div class="stats" id="rStats"></div>
    <div class="lessons" id="rLessons"></div>
    <button class="btn2" id="rTitleBtn">タイトルへ</button>
  </div>
</div>

<div class="overlay" id="gate" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:36px">焼肉ギリギリ</h1>
    <p class="sub">合言葉を入れてね</p>
    <input id="gateInput" class="field" type="text" autocomplete="off" autocapitalize="off" placeholder="合言葉">
    <p class="tip" id="gateMsg">&nbsp;</p>
    <button class="btn" id="gateBtn">はいる</button>
  </div>
</div>

<script src="src/sim.js?v=dev"></script>
<script src="src/lines.js?v=dev"></script>
<script src="src/draw.js?v=dev"></script>
<script src="src/sound.js?v=dev"></script>
<script src="src/gate.js?v=dev"></script>
<script src="src/playtest.js?v=dev"></script>
<script src="src/main.js?v=dev"></script>
</body>
</html>
