  .btn2:active { transform: translateY(2px) scale(.96); }
  .btn2.back::before { content: '← '; color: #ffd84d; }
  .btn2.share { color: #ffd84d; font-size: 19px; transform: rotate(-2deg); }
  .btn2.share::after { content: ' ↗'; font-size: 15px; }
  #pause .about { display: block; margin: 18px auto 0; font-size: 13px; opacity: .8; }
  .tiny { color: #ffe2bf; font-size: 15px; text-decoration: none; text-shadow: var(--o2); }
  /* 選ぶ行：箱なし。絵＋文字 */
  .srow { margin-top: 2px; padding: 8px 12px; background: none; border-radius: 0; text-shadow: var(--o2); }
  .srow:active { transform: scale(.97); }
  .srow.cur { outline: 0; background: var(--maru) center / 100% 100% no-repeat; }
  .srow .no { width: 40px; height: auto; border-radius: 0; background: none; color: #ffd84d; font-size: 28px; text-shadow: var(--o2); }
  .srow .no.lvi { width: 64px; background: none; }
  .srow .no img { width: 64px; height: auto; display: block; filter: drop-shadow(0 3px 0 rgba(0,0,0,.45)); }
  .srow .tx b { font-size: 18px; }
  .srow .tx small { font-size: 13px; color: #ffe2bf; }
  .srow .st { text-shadow: var(--o2); }
  .srow .goaln { font-size: 12px; color: #ffe2bf; }
  .srow.lock { opacity: .5; }
  .srow.lock .no { background: none; color: #cdb8a4; }
  .srow.free .no { background: none; color: #ff6a4a; font-size: 20px; width: 52px; }
  .stars { color: #ffd84d; text-shadow: var(--o2); }
  .stars i { color: #6a5040; }
  .lvhead { margin: 14px 4px 0; color: #ffd84d; font-size: 17px; font-weight: 400; text-shadow: var(--o2); transform: rotate(-1.5deg); }
  .lvhead small { color: #ffe2bf; font-size: 13px; font-weight: 400; }
  .goal { color: #ffe2bf; text-shadow: var(--o2); font-size: 14px; }
  .goalbig { color: #fff; font-size: 20px; font-weight: 400; }
  .goalbig b { font-family: var(--num); font-weight: 400; color: #ffd84d; font-size: 28px; }
  /* 道具 */
  .tool .pips { width: 70px; }
  .tool .pips svg { width: 54px; height: 20px; display: block; margin: 0 auto; }
  .tool .pips small { margin-top: 2px; padding: 0; background: none; color: #ff8a5a; font-size: 14px; font-weight: 400; text-shadow: var(--o2); transform: rotate(-4deg); }
  .tool.max .pips small { background: none; color: #ffd84d; }
  .tool .tx small .nx { color: #fff; font-weight: 400; }
  .lvbox { margin: 8px 0 0; padding: 0; background: none; border-radius: 0; color: #ffe2bf; font-size: 15px; text-shadow: var(--o2); }
  .lvbox .lvl { font-size: 22px; text-shadow: var(--o2); }
  .lvbox .bar { display: none; }
  .lvbox .lvrule { color: #e8c9a8; font-size: 12.5px; }
  .lvbox .up { font-weight: 400; color: #fff; }
  .lvbox .btn2 { margin: 6px 0 0; background: none; color: #ff8a5a; font-size: 19px; }
  /* 店長のひとこと：手で描いた吹き出し */
  .boss { display: flex; align-items: flex-end; gap: 2px; margin: 0 0 4px; text-align: left; text-shadow: none; }
  .boss img { flex: none; width: 80px; height: auto; margin-right: -4px; }
  .boss .say { position: relative; flex: 1; margin-bottom: 30px; padding: 10px 12px 10px 14px; background: #fffaf0; color: var(--ink); font-size: 15.5px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; border: 3px solid var(--ink); border-radius: 26px 20px 30px 16px / 20px 28px 18px 30px; transform: rotate(-1deg); }
  .boss .say::before { content: ''; position: absolute; left: -15px; bottom: 12px; border: 9px solid transparent; border-right: 15px solid var(--ink); }
  .boss .say::after { content: ''; position: absolute; left: -9px; bottom: 14px; border: 7px solid transparent; border-right: 11px solid #fffaf0; }
  .boss .say p { margin: 0; }
  .boss .say p + p { margin-top: 4px; }
  .boss .say b { color: #c0282a; font-weight: 400; }
  .intro-list { display: none; }
  .intro-no { color: #ffe2bf; text-shadow: var(--o2); letter-spacing: .1em; }
  .sub { color: #ffe2bf; text-shadow: var(--o2); }
  /* 結果 */
  .rank { min-width: 0; width: 150px; height: 150px; padding: 0; border: 6px solid currentColor; border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%; background: none !important; box-shadow: none !important; text-shadow: none !important; filter: url(#inky); }
  .rank .rk { font-size: 54px; }
  .rank .rw { font-size: 14px; font-weight: 400; max-width: 120px; }
  .r-C { color: #b9b0a6; } .r-B { color: #e3a06a; } .r-A3 { color: #e9edf2; } .r-A4 { color: #ffd84d; } .r-A5 { color: #ff6f9a; }
  .r-tokusen { color: #ffe36a; } .r-tokusen .rk { font-size: 34px; } .r-kikaku { color: #ff4a3a; } .r-kikaku .rk { color: inherit; font-size: 40px; }
  .rank.r-stage { width: auto; height: auto; border: 0; color: #ffd84d; filter: none; }
  .rank.r-stage .rk { font-size: 64px; letter-spacing: 2px; text-shadow: var(--o3) !important; }
  .rank.r-stage .rk i { color: #6a5040; }
  .rank.r-stage .rw { color: #fff; text-shadow: var(--o2) !important; max-width: none; }
  .rank.r-stage0 { color: #ffd84d; }
  .next { color: #ffe2bf; text-shadow: var(--o2); font-size: 15px; }
  .score { text-shadow: var(--o3), 0 8px 0 #a3261b; }
  .cost { color: #ff9a8a; font-size: 14px; text-shadow: var(--o2); }
  .new { background: none; color: #ff5a3a; font-family: var(--num); font-size: 20px; padding: 0; border-radius: 0; text-shadow: var(--o2); transform: rotate(-4deg); }
  .best { color: #ffe2bf; text-shadow: var(--o2); }
  .lessons { text-align: left; margin-top: 12px; }
  .lessons div { background: none; padding: 0; margin: 0; }
  .title { color: #ffe2bf; text-shadow: var(--o2); font-size: 14px; margin-top: 16px; }
  .title b { text-shadow: var(--o3); letter-spacing: -.03em; }
  .stats { display: block; margin: 8px 0 0; font-size: 14px; color: #ffe2bf; line-height: 1.8; }
  .stats div { display: inline-block; margin: 0 6px; padding: 0; background: none; border-radius: 0; font-size: 14px; }
  .stats div b { display: inline; margin-left: 4px; font-size: 18px; text-shadow: var(--o2); }
  .stats div.bad b { color: #ff9a8a; }
  /* 試遊会・合言葉 */
  .field { background: none; color: #fff; border-radius: 0; border-bottom: 3px solid #ffd84d; text-shadow: var(--o2); }
  .field::placeholder { color: rgba(255,226,191,.65); text-shadow: none; }
  .pt { background: none; padding: 4px 0 0; border-radius: 0; }
  .pt-q { color: #ffe2bf; font-size: 15px; text-shadow: var(--o2); }
  .pt-faces button { background: none; border: 0; color: #ffe2bf; font-size: 14px; padding: 8px 0; text-shadow: var(--o2); font-family: inherit; }
  .pt-faces button span { display: none; }
  .pt-faces button.sel { background: var(--maru) center / 100% 100% no-repeat; color: #fff; }
  .pt textarea { background: none; color: #fff; border-radius: 0; border-bottom: 3px solid #ffd84d; text-shadow: var(--o2); }
  .pt textarea::placeholder { color: rgba(255,226,191,.6); text-shadow: none; }
  .pt-thanks { text-shadow: var(--o2); }
  #rotate { text-shadow: var(--o2); font-weight: 400; }
  #rotate .ph { border-color: #ffd84d; border-radius: 10px 12px 9px 13px; box-shadow: 0 0 0 3px var(--ink); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="inky"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>
<canvas id="cv"></canvas>
<div id="safe"></div>

<div class="overlay" id="title">
 <div id="titleFrame">
  <div class="tband">
    <h1 class="logo"><small>焼肉</small>ジュー</h1>
    <div class="best" id="titleBest"></div>
  </div>
  <div class="card">
    <div class="stage-next" id="titleStage"></div>
    <div id="ptNameBox" hidden><input id="ptName" class="field pt-name" type="text" maxlength="20" autocomplete="off" placeholder="あなたの名前。あだ名でいい"></div>
    <div class="tboss"><span>へい、らっしゃい！</span><img id="titleBoss" alt=""></div>
    <button class="btn" id="startBtn">焼く</button>
    <button class="tiny" id="stageBtn">ステージをえらぶ</button><button class="tiny" id="toolBtn">道具</button>
    <button class="tiny" id="ptNextTitle" hidden title="名前と記録を消して、はじめから">次の人に渡す</button>
  </div>
 </div>
</div>

<div class="overlay dim" id="stages" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:32px">ステージ</h1>
    <div class="slist" id="stageList"></div>
    <button class="tiny" id="lvBtn">腕前をえらびなおす</button>
    <button class="btn2 back" id="stagesClose">もどる</button>
  </div>
</div>

<div class="overlay dim" id="tools" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:32px">道具</h1>
    <div class="boss" id="toolBoss"></div><div class="lvbox" id="toolInfo"></div>
    <div class="slist" id="toolList"></div>
    <button class="btn2 back" id="toolsClose">もどる</button>
  </div>
</div>

<div class="overlay dim" id="levels" hidden>
  <div class="card">
    <div class="boss" id="levelBoss"></div>
    <div class="slist" id="levelList"></div>
    <p class="sub" style="font-size:13px">あとから「ステージをえらぶ」で変えられる</p>
    <button class="btn2 back" id="levelsClose">もどる</button>
  </div>
</div>

<div class="overlay dim" id="intro" hidden>
  <div class="card">
    <div class="intro-no" id="introNo"></div>
    <h1 class="logo" style="font-size:36px" id="introName"></h1>
    <ul class="intro-list" id="introList"></ul><div class="boss" id="introBoss"></div>
    <div class="goal" id="introGoal"></div>
    <button class="btn" id="introGo">焼く！</button>
  </div>
</div>

<div class="overlay dim" id="pause" hidden>
  <div class="card">
    <h1 class="logo" style="font-size:38px">ひと休み</h1>
    <p class="sub">火も時間も止まっています</p>
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn2" id="retryBtn">はじめから</button>
    <button class="btn2" id="toTitleBtn">タイトルへ</button>
    <a class="tiny about" href="about.html">このゲームについて</a>
  </div>
</div>

<div class="overlay dim" id="result" hidden>
  <div class="card">
    <div class="rank" id="rRank"></div>
    <div class="next" id="rNext"></div>
    <div class="score" id="rScore" style="font-size:44px">0</div>
    <div class="cost" id="rCost"></div>
    <div id="rNew"></div>
    <div class="best" id="rBest" style="margin-top:2px"></div>
    <button class="btn" id="againBtn">もう一回</button>
    <div><button class="btn2 share" id="rShare">自慢する</button></div>
    <div><button class="btn2" id="rRetry" hidden>もう一回</button><button class="btn2" id="rStages" hidden>ステージをえらぶ</button><button class="btn2" id="rTitleBtn">タイトルへ</button></div>
    <div class="lvbox" id="rLevel"></div>
    <div class="lessons" id="rLessons"></div>
    <div class="pt" id="ptFeedback" hidden></div>
    <div class="title">今日の称号<b id="rTitle"></b><span id="rWhy"></span></div>
    <div class="stats" id="rStats"></div>
    <button class="btn2" id="ptNextResult" hidden>次の人に渡す</button>
  </div>
</div>

<div class="overlay" id="rotate" hidden>
  <div class="ph"></div>
  スマホを縦にしてね
</div>

<script src="src/sim.js?v=dev"></script>
<script src="src/lines.js?v=dev"></script>
<script src="src/draw.js?v=dev"></script>
<script src="src/sound.js?v=dev"></script>
<script src="src/playtest.js?v=dev"></script>
<script src="src/main.js?v=dev"></script>
<script src="src/count.js?v=dev"></script>
</body>
</html>
