<title data-en="About JUU">ジューについて</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  @font-face { font-family: 'Yusei Magic'; src: url(fonts/YuseiMagic.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Potta One'; src: url(fonts/PottaOne.woff2) format('woff2'); font-display: swap; }
  body { margin: 0; background: #1a100c; color: #ffe2bf; font-family: 'Yusei Magic', 'Hiragino Sans', sans-serif; line-height: 1.8; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-family: 'Potta One', sans-serif; font-weight: 400; color: #ffd84d; font-size: 40px; margin: 0 0 8px; text-shadow: 0 3px 0 #a3261b; }
  h2 { font-family: 'Potta One', sans-serif; font-weight: 400; color: #ffd84d; font-size: 20px; margin: 28px 0 4px; }
  p { margin: 6px 0; }
  a { color: #ffd84d; }
  .back { display: inline-block; margin-top: 28px; font-size: 18px; }
</style>

<body>
<main>
  <h1 data-en="JUU">ジュー</h1>
  <p data-en="You're running the grill at a yakiniku joint. Cook every order just how they asked. A dumb little game about doneness.">焼肉屋の網をまかされた。客の注文どおりに焼いて出す、焼き加減のクソゲー。</p>

  <h2 data-en="What we count">数えていること</h2>
  <p data-en="Only how many people played and which stage they ended on, via GoatCounter. No cookies. Nothing that identifies you, like a name or contact info, is ever sent.">何人が遊んだか、どのステージで終わったかだけを数えています（GoatCounter）。クッキーは使いません。名前や連絡先など、だれかが分かるものは送りません。</p>
  <p data-en="Your best scores and stars stay on this device.">自己ベストや★は、この端末の中にだけ保存しています。</p>

  <h2 data-en="Credits">使っているもの</h2>
  <p data-en="Fonts: Potta One and Yusei Magic, SIL Open Font License. Every picture and sound is made in code.">字：Potta One・Yusei Magic（SIL Open Font License）。絵と音は、すべてプログラムで作っています。</p>

  <a class="back" href="./" data-en="&larr; Back to the game">← ゲームにもどる</a>
</main>
