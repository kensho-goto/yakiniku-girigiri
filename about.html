  <h1>ジュー</h1>
  <p>焼肉屋の網をまかされた。客の注文どおりに焼いて出す、焼き加減のクソゲー。</p>

  <h2>数えていること</h2>
  <p>何人が遊んだか、どのステージで終わったかだけを数えています（GoatCounter）。クッキーは使いません。名前や連絡先など、だれかが分かるものは送りません。</p>
  <p>自己ベストや★は、この端末の中にだけ保存しています。</p>
