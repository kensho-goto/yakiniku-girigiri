<!doctype html><html><head><meta charset="utf-8">
<!-- アプリのアイコンの元（512×512）。tools/icon.js で撮って icon-*.png にする -->
<style>
@font-face { font-family: 'Potta One'; src: url(../fonts/PottaOne.woff2); }
@font-face { font-family: 'Yusei Magic'; src: url(../fonts/YuseiMagic.woff2); }
html, body { margin: 0; }
.ic { position: relative; width: 512px; height: 512px; overflow: hidden; background: radial-gradient(circle at 50% 78%, #ff7a2f 0, #c8401c 18%, #4a2414 46%, #23120a 72%); }
.ami { position: absolute; left: -40px; right: -40px; bottom: -150px; height: 330px; border-radius: 50%; border: 18px solid #1c1310;
  background: repeating-linear-gradient(90deg, rgba(220,226,232,.55) 0 5px, transparent 5px 34px), repeating-linear-gradient(0deg, rgba(220,226,232,.4) 0 5px, transparent 5px 34px), radial-gradient(circle at 50% 30%, #ffb347, #e2501f 40%, #5a1d0c 75%); }
.yu { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font: 52px 'Potta One'; letter-spacing: .3em; color: #ff5a3a; transform: rotate(4deg) translateX(-70px);
  text-shadow: -4px -4px 0 #2a1206, 4px -4px 0 #2a1206, -4px 4px 0 #2a1206, 4px 4px 0 #2a1206, 0 6px 0 #2a1206; }
.ju { position: absolute; left: 0; right: 0; top: 118px; text-align: center; font: 168px/1 'Potta One'; letter-spacing: -.06em; color: #ffd84d; transform: rotate(-5deg);
  text-shadow: -8px -8px 0 #2a1206, 8px -8px 0 #2a1206, -8px 8px 0 #2a1206, 8px 8px 0 #2a1206, 0 -9px 0 #2a1206, 0 9px 0 #2a1206, -9px 0 0 #2a1206, 9px 0 0 #2a1206, 0 22px 0 #a3261b, 0 0 60px rgba(255,140,40,.8); }
.st { position: absolute; top: 330px; width: 34px; height: 120px; border-radius: 50%; border-left: 12px solid rgba(255,255,255,.55); filter: blur(4px); }
</style></head><body>
<div class="ic"><div class="ami"></div><div class="st" style="left:170px"></div><div class="st" style="left:300px;top:310px"></div><div class="yu">焼肉</div><div class="ju">ジュー</div></div>
</body></html>
