<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ジュー 試遊会</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #2a1a14; color: #fff; font-family: 'Hiragino Sans', sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { color: #ffd84d; font-size: 30px; margin: 0 0 16px; }
  p { font-size: 17px; line-height: 1.7; color: #ffd9b0; margin: 8px 0; }
  .dot { display: inline-block; animation: b 1s infinite; }
  @keyframes b { 50% { opacity: .2; } }
  button { margin-top: 16px; font: inherit; font-size: 18px; font-weight: 900; padding: 12px 28px; border: 0; border-radius: 14px; background: #ffb52e; color: #3a1d0b; }
</style>
</head>
<body>
<div>
  <h1>ジュー 試遊会</h1>
  <p id="msg">つないでいます<span class="dot">…</span></p>
  <button id="again" hidden>もう一度</button>
</div>
<script>
// 試遊会の入口。この URL は変わらない。試遊サーバー（tools/playtest.js）が、
// そのときの URL を GitHub の playtest-url ブランチの url.json に書くので、それを読んで飛ぶ。
(function () {
  'use strict';
  var REPO = 'kensho-goto/yakiniku-girigiri', BRANCH = 'playtest-url', FILE = 'url.json';
  var msg = document.getElementById('msg'), again = document.getElementById('again');
  function show(t) { msg.textContent = t; again.hidden = false; }
  again.onclick = function () { location.reload(); };
  function ok(j) { return j && j.on && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(j.url || ''); }
  function getJson(u, pick) {
    return fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(pick);
  }
  // 1. GitHub の API（すぐ新しくなる）→ 2. raw（数分古いことがある。API の回数制限のとき）
  getJson('https://api.github.com/repos/' + REPO + '/contents/' + FILE + '?ref=' + BRANCH + '&t=' + Date.now(), function (j) {
    return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g, '')))));
  }).catch(function () {
    return fetch('https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + FILE + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return null; // まだ一度も試遊会をしていない
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }).then(function (j) {
    if (ok(j)) { msg.textContent = 'ゲームを開いています…'; location.replace(j.url + '/'); }
    else show('いまは試遊会をしていません。始まったら、もう一度開いてください。');
  }).catch(function () {
    show('つながりませんでした。電波のよいところで、もう一度押してください。');
  });
})();
</script>
</body>
</html>
